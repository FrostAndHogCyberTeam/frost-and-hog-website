<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Project — Frost & Hog</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F2F0E9; --ink: #111; --cyan: #00A3FF; --pink: #FF5C8A; --border: #D0CDC5; --font-serif: 'Instrument Serif', serif; --font-sans: 'Space Grotesk', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeUp 0.8s ease-out forwards; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5vw; border-bottom: 1px solid var(--border); }
        .nav-brand { font-family: var(--font-serif); font-size: 1.5rem; font-style: italic; }
        .menu-btn { font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .menu-btn:hover { color: var(--pink); }
        
        .sidebar { position: fixed; top: 0; right: -100%; width: 350px; height: 100vh; background: var(--ink); color: var(--bg); border-left: 1px solid var(--border); z-index: 1001; transition: right 0.5s cubic-bezier(0.8, 0, 0.2, 1); padding: 10vh 40px; display: flex; flex-direction: column; }
        .sidebar.active { right: 0; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 2rem; cursor: pointer; color: var(--bg); transition: 0.3s; }
        .close-btn:hover { transform: rotate(90deg); color: var(--pink); }
        .menu-links { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .menu-links a { color: var(--bg); font-size: 1.2rem; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; transition: 0.2s; }
        .menu-links a:hover { color: var(--cyan); padding-left: 10px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .overlay.active { display: block; opacity: 1; }

        .form-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .form-container { width: 100%; max-width: 600px; padding: 40px; background: #fff; border: 1px solid var(--border); box-shadow: 10px 10px 0px rgba(0,0,0,0.05); }
        
        .header h1 { font-family: var(--font-serif); font-size: 3rem; line-height: 1; margin-bottom: 10px; }
        .header p { font-size: 1rem; color: #666; margin-bottom: 40px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 8px; letter-spacing: 1px; }
        input, textarea { width: 100%; padding: 12px 0; background: transparent; border: none; border-bottom: 1px solid var(--border); font-family: var(--font-sans); font-size: 1rem; color: var(--ink); outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-bottom-color: var(--cyan); }
        textarea { resize: vertical; min-height: 100px; }
        
        button { width: 100%; padding: 15px; background: var(--ink); color: var(--bg); border: none; font-family: var(--font-sans); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background: var(--pink); color: #fff; transform: translateY(-3px); box-shadow: 0 10px 15px rgba(255, 92, 138, 0.2); }

        .back-link { display: inline-block; margin-top: 20px; font-size: 0.9rem; text-decoration: underline; color: #666; }
        .back-link:hover { color: var(--ink); }

        footer { background-color: var(--ink); color: var(--bg); padding: 30px 5vw; border-top: 1px solid #333; margin-top: auto; width: 100%; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .footer-left { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        .footer-logo { font-family: var(--font-serif); font-size: 1.5rem; border: 1px solid var(--bg); border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; }
        .footer-right { display: flex; gap: 15px; }
        .footer-right a { color: var(--bg); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; border: 1px solid var(--bg); padding: 10px 20px; transition: 0.3s; display: inline-block; }
        .footer-right a:hover { background: var(--bg); color: var(--ink); transform: translateY(-3px); }

        @media (max-width: 768px) {
            .form-container { padding: 30px 20px; }
            .sidebar { width: 100%; }
            .footer-content { flex-direction: column; text-align: center; }
            .footer-right { flex-direction: column; width: 100%; }
            .footer-right a { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <nav class="animate-in">
        <a href="index.html" class="nav-brand">Frost & Hog.</a>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </nav>

    <div class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="layanan.html">Services</a>
            <a href="operations.html">Operations Log</a>
            <a href="founders.html">Founder</a>
            <a href="legalitas.html">Legal</a>
            <a href="https://frostandhogcyberteam.github.io/frost-and-hog-portofolio/" target="_blank">Portfolio ↗</a>
            <a href="https://frostandhogcyberteam.github.io/frost-and-hog-weather/" target="_blank">Weather ↗</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="form-wrapper animate-in">
        <div class="form-container">
            <div class="header">
                <h1>Let's talk.</h1>
                <p>Ceritakan kebutuhan Anda. Kami akan merespons dalam 1x24 jam.</p>
            </div>
            
            <form id="clientForm">
                <div class="form-group">
                    <label>Service Needed</label>
                    <input type="text" id="serviceInput" readonly value="General Inquiry" style="border-bottom: 1px dashed var(--pink);">
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="nameInput" required placeholder="Nama Anda">
                </div>
                <div class="form-group">
                    <label>Contact (WA / Discord)</label>
                    <input type="text" id="contactInput" required placeholder="0812xxxx / user#1234">
                </div>
                <div class="form-group">
                    <label>Project Details</label>
                    <textarea id="detailInput" required placeholder="Jelaskan secara singkat apa yang ingin dibangun atau diamankan."></textarea>
                </div>
                <button type="submit" id="submitBtn">Send Request</button>
            </form>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-logo">C</div>
                <span>2026 Frost & Hog Cyber Team. All rights reserved.</span>
            </div>
            <div class="footer-right">
                <a href="index.html">Back to Home</a>
                <a href="https://frostandhogcyberteam.github.io/frost-and-hog-website/">Main Portal ↗</a>
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const serviceParam = urlParams.get('service');
        if(serviceParam) {
            document.getElementById('serviceInput').value = serviceParam;
        }

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            const name = document.getElementById('nameInput').value;
            const contact = document.getElementById('contactInput').value;
            const detail = document.getElementById('detailInput').value;
            const service = document.getElementById('serviceInput').value;

            const data = {
                username: "🚨 FH2 EMERGENCY SYSTEM 🚨",
                embeds: [{
                    title: "🚨 ATTENTION: NEW CLIENT REQUEST 🚨",
                    description: "**ACTION REQUIRED IMMEDIATELY**\n\nAda klien baru yang membutuhkan bantuan Anda. Segera hubungi mereka!",
                    color: 16711680, // MERAH MENYALA
                    fields: [
                        { name: "🛠️ Service", value: `\`${service}\``, inline: true },
                        { name: "👤 Name", value: name, inline: true },
                        { name: "📞 Contact", value: contact, inline: false },
                        { name: "📝 Details", value: detail, inline: false }
                    ],
                    footer: { text: "Frost & Hog Cyber Team - Secure Portal" },
                    timestamp: new Date().toISOString()
                }]
            };

            // GANTI URL INI DENGAN WEBHOOK DISCORD KAMU
            const webhookURL = "https://discord.com/api/webhooks/1562930745431826474/vO1UYMEEa3VpfgObIzqjlRF4CrlN8yjNmWBfNQuYPDRFdv-t71K_BStOe24KSiDX4Iw_"; 
            
            if(webhookURL === "URL_WEBHOOK_DISCORD_KAMU") {
                alert("Sistem belum terhubung ke Discord. Harap isi URL Webhook di kode form.html.");
                btn.innerText = "Send Request"; btn.disabled = false; return;
            }

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if(res.ok) {
                    alert("Pesan terkirim. Anda akan diarahkan ke Surat Perjanjian.");
                    window.location.href = "surat-kuasa.html?nama=" + encodeURIComponent(name) + "&layanan=" + encodeURIComponent(service);
                } else {
                    throw new Error('Gagal');
                }
            }).catch(err => {
                alert("Terjadi kesalahan saat mengirim pesan. Coba lagi.");
                btn.innerText = "Send Request"; btn.disabled = false;
            });
        });

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
