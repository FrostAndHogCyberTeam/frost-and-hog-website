<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Project — Frost & Hog</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F2F0E9; --ink: #111; --cyan: #00A3FF; --pink: #FF5C8A; --border: #D0CDC5; --font-serif: 'Instrument Serif', serif; --font-sans: 'Space Grotesk', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .form-container { width: 100%; max-width: 600px; padding: 40px; background: #fff; border: 1px solid var(--border); box-shadow: 10px 10px 0px rgba(0,0,0,0.05); margin: 20px;}
        .header h1 { font-family: var(--font-serif); font-size: 3rem; line-height: 1; margin-bottom: 10px; }
        .header p { font-size: 1rem; color: #666; margin-bottom: 40px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 8px; letter-spacing: 1px; }
        input, textarea { width: 100%; padding: 12px 0; background: transparent; border: none; border-bottom: 1px solid var(--border); font-family: var(--font-sans); font-size: 1rem; color: var(--ink); outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-bottom-color: var(--cyan); }
        textarea { resize: vertical; min-height: 100px; }
        
        button { width: 100%; padding: 15px; background: var(--ink); color: var(--bg); border: none; font-family: var(--font-sans); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background: var(--pink); color: #fff; }

        .back-link { display: inline-block; margin-top: 20px; font-size: 0.9rem; text-decoration: underline; color: #666; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>Let's talk.</h1>
            <p>Ceritakan kebutuhan Anda. Kami akan merespons dalam 1x24 jam.</p>
        </div>
        
        <form id="clientForm">
            <div class="form-group">
                <label>Service Needed</label>
                <input type="text" id="serviceInput" readonly value="General Inquiry" style="border-bottom: 1px dashed var(--pink);">
            </div>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="nameInput" required placeholder="Nama Anda">
            </div>
            <div class="form-group">
                <label>Contact (WA / Discord)</label>
                <input type="text" id="contactInput" required placeholder="0812xxxx / user#1234">
            </div>
            <div class="form-group">
                <label>Project Details</label>
                <textarea id="detailInput" required placeholder="Jelaskan secara singkat apa yang ingin dibangun atau diamankan."></textarea>
            </div>
            <button type="submit" id="submitBtn">Send Request</button>
        </form>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Mengambil parameter URL (misal form.html?service=Cyber Security)
        const urlParams = new URLSearchParams(window.location.search);
        const serviceParam = urlParams.get('service');
        if(serviceParam) {
            document.getElementById('serviceInput').value = serviceParam;
        }

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            const data = {
                username: "FH2 Client Portal",
                embeds: [{
                    title: "New Project Inquiry",
                    color: 3924470, // Pink/Cyan hex
                    fields: [
                        { name: "Service", value: document.getElementById('serviceInput').value },
                        { name: "Name", value: document.getElementById('nameInput').value },
                        { name: "Contact", value: document.getElementById('contactInput').value },
                        { name: "Details", value: document.getElementById('detailInput').value }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // GANTI URL INI DENGAN WEBHOOK DISCORD KAMU
            const webhookURL = "https://discord.com/api/webhooks/1562930745431826474/vO1UYMEEa3VpfgObIzqjlRF4CrlN8yjNmWBfNQuYPDRFdv-t71K_BStOe24KSiDX4Iw_"; 
            
            if(webhookURL === "URL_WEBHOOK_DISCORD_KAMU") {
                alert("Sistem belum terhubung ke Discord. Harap isi URL Webhook di kode form.html.");
                btn.innerText = "Send Request"; btn.disabled = false; return;
            }

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if(res.ok) {
                    alert("Pesan terkirim. Kami akan segera menghubungi Anda.");
                    window.location.href = "index.html";
                } else {
                    throw new Error('Gagal');
                }
            }).catch(err => {
                alert("Terjadi kesalahan saat mengirim pesan.");
                btn.innerText = "Send Request"; btn.disabled = false;
            });
        });
    </script>
</body>
</html>
