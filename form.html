<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Project — Frost & Hog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #09090B; --panel: #111113; --border: #27272A; --ink: #FAFAFA; --muted: #A1A1AA; --cyan: #00F0FF; --pink: #FF007F; --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
        a { color: var(--ink); text-decoration: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 60px; border-bottom: 1px solid var(--border); position: fixed; top: 0; width: 100%; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(10px); z-index: 100; }
        .nav-brand { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }

        .form-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 100px 20px 40px; }
        .form-container { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 40px; }
        
        .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.03em; }
        .header p { font-size: 0.9rem; color: var(--muted); margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        input, textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-sans); font-size: 0.95rem; color: var(--ink); outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--cyan); }
        textarea { resize: vertical; min-height: 100px; }
        
        button { width: 100%; padding: 14px; background: var(--ink); color: var(--bg); border: none; border-radius: 6px; font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: var(--cyan); color: #000; }
        button:disabled { background: #333; color: #888; cursor: not-allowed; }

        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); text-decoration: underline; }

        footer { border-top: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-top: auto; }
        .c-icon { border: 1px solid var(--border); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; margin-right: 5px;}
    </style>
</head>
<body>
    <nav class="animate-in">
        <div class="nav-brand">FROST & HOG</div>
    </nav>

    <div class="form-wrapper animate-in">
        <div class="form-container">
            <div class="header">
                <h1>Let's talk.</h1>
                <p>Ceritakan kebutuhan Anda. Kami akan merespons dalam 1x24 jam.</p>
            </div>
            
            <form id="clientForm">
                <div class="form-group">
                    <label>Service Needed</label>
                    <input type="text" id="serviceInput" readonly value="General Inquiry" style="border-color: var(--pink); color: var(--pink); font-weight: bold;">
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="nameInput" required placeholder="Nama Anda">
                </div>
                <div class="form-group">
                    <label>Contact (WA / Discord)</label>
                    <input type="text" id="contactInput" required placeholder="0812xxxx / user#1234">
                </div>
                <div class="form-group">
                    <label>Project Details</label>
                    <textarea id="detailInput" required placeholder="Jelaskan secara singkat kebutuhan Anda."></textarea>
                </div>
                <button type="submit" id="submitBtn">Send Request</button>
            </form>
            <a href="index.html" class="back-link">← Back to Interface</a>
        </div>
    </div>

    <footer>
        <span><span class="c-icon">C</span> 2026 FROST & HOG.</span>
        <span>ALL RIGHTS RESERVED.</span>
    </footer>

    <script>
        // Ambil parameter service dari URL (jika ada)
        const urlParams = new URLSearchParams(window.location.search);
        const serviceParam = urlParams.get('service');
        if(serviceParam) { 
            document.getElementById('serviceInput').value = serviceParam; 
        }

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "SENDING DATA..."; 
            btn.disabled = true;

            const name = document.getElementById('nameInput').value;
            const contact = document.getElementById('contactInput').value;
            const detail = document.getElementById('detailInput').value;
            const service = document.getElementById('serviceInput').value;

            // Struktur data untuk Discord
            const data = {
                username: "🚨 FH2 EMERGENCY SYSTEM 🚨",
                embeds: [{
                    title: "🚨 ATTENTION: NEW CLIENT REQUEST 🚨",
                    description: "**ACTION REQUIRED IMMEDIATELY**\n\nAda klien baru. Segera hubungi mereka!",
                    color: 16711680, // Warna Merah
                    fields: [
                        { name: "🛠️ Service", value: `\`${service}\``, inline: true },
                        { name: "👤 Name", value: name, inline: true },
                        { name: "📞 Contact", value: contact, inline: false },
                        { name: "📝 Details", value: detail, inline: false }
                    ],
                    footer: { text: "Frost & Hog Cyber Team - Secure Portal" },
                    timestamp: new Date().toISOString()
                }]
            };

            // =========================================================
            // ⚠️ GANTI BARIS DI BAWAH INI DENGAN LINK WEBHOOK DISCORD KAMU
            // =========================================================
            const webhookURL = "https://discord.com/api/webhooks/GANTI_DENGAN_LINK_KAMU"; 
            
            // Pengaman: Jika link belum diganti, munculkan peringatan
            if(webhookURL.includes("GANTI_DENGAN_LINK_KAMU")) {
                alert("ERROR: Link Webhook Discord belum dimasukkan ke dalam kode.");
                btn.innerText = "Send Request"; 
                btn.disabled = false; 
                return;
            }

            // Proses pengiriman ke Discord
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if(response.ok) {
                    alert("✅ Pesan berhasil terkirim ke Discord! Anda akan diarahkan ke Surat Perjanjian.");
                    
                    // Direct ke surat kuasa membawa data nama & layanan
                    window.location.href = "surat-kuasa.html?nama=" + encodeURIComponent(name) + "&layanan=" + encodeURIComponent(service);
                } else {
                    throw new Error('Network response was not ok.');
                }
            })
            .catch(error => {
                // Jika gagal kirim, tampilkan pesan error
                console.error('Error:', error);
                alert("❌ GAGAL MENGIRIM. Periksa koneksi internetmu atau pastikan link Webhook benar.");
                btn.innerText = "Send Request"; 
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
